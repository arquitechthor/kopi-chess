# git-cliff (https://git-cliff.org): CHANGELOG.md from the Conventional Commits
# of this repository (CONTRIBUTING.md). Regenerate it when cutting a release:
#
#   docker run --rm -v "$PWD":/app -w /app orhunp/git-cliff:2.14.2 --tag vX.Y.Z -o CHANGELOG.md
#
# (PowerShell: -v "${PWD}:/app"). Without --tag, what is not released yet goes
# under "Unreleased".

[changelog]
header = """
# Changelog

Every change to Kopi Chess, release by release, newest first. It is generated
from the commit messages by [git-cliff](https://git-cliff.org) (`cliff.toml`);
each release's highlights are in its
[GitHub release](https://github.com/arquitechthor/kopi-chess/releases).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/arquitechthor/kopi-chess/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**Breaking:** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/arquitechthor/kopi-chess/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
# Every release ends with a blank line; the footer closes the file after the last one.
footer = "<!-- generated by git-cliff from cliff.toml: do not edit by hand -->"
# Off: the templates above set every blank line themselves.
trim = false

[git]
conventional_commits = true
# "Initial commit" and anything else outside the convention is left out.
filter_unconventional = true
protect_breaking_commits = true
# The HTML comments only order the groups; they are stripped from the headings.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^test", group = "<!-- 5 -->Tests" },
    { message = "^build", group = "<!-- 6 -->Build and dependencies" },
    { message = "^ci", group = "<!-- 7 -->Continuous integration" },
    { message = "^chore", group = "<!-- 8 -->Other" },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
