# REST API texts, English (default language): ProblemDetail titles and details, bot descriptions.
# Every key must also exist in messages_es.properties (checked by RestMessageBundlesTest).
# Keys start with "rest." because all bundles share one MessageSource in kopi-bootstrap.

rest.problem.INVALID_REQUEST.title=Invalid request
rest.problem.INVALID_REQUEST.detail=The request is not well formed: {0}
rest.problem.INVALID_UCI.title=Not a UCI move
rest.problem.INVALID_UCI.detail="{0}" is not written like a UCI move, such as e2e4 or e7e8q.
rest.problem.GAME_NOT_FOUND.title=Game not found
rest.problem.GAME_NOT_FOUND.detail=There is no game {0}.
rest.problem.ANALYSIS_NOT_FOUND.title=No analysis
rest.problem.ANALYSIS_NOT_FOUND.detail=The analysis of game {0} was never asked for. Ask for it with POST.
rest.problem.GAME_NOT_FINISHED.title=Game not finished
rest.problem.GAME_NOT_FINISHED.detail=Game {0} is still being played; it can be analysed once it is over.
rest.problem.NOTHING_TO_ANALYSE.title=Nothing to analyse
rest.problem.NOTHING_TO_ANALYSE.detail=Game {0} ended before any move was played.
rest.problem.GAME_NOT_IN_PROGRESS.title=Game over
rest.problem.GAME_NOT_IN_PROGRESS.detail=The game {0} has finished; it takes no more moves.
rest.problem.NOT_YOUR_TURN.title=Not your turn
rest.problem.NOT_YOUR_TURN.detail=It is not your turn in game {0}.
rest.problem.ILLEGAL_MOVE.title=Illegal move
rest.problem.ILLEGAL_MOVE.detail={0} is not a legal move in the current position.
rest.problem.PRECONDITION_REQUIRED.title=Version required
rest.problem.PRECONDITION_REQUIRED.detail=Send the version you last saw in an If-Match header (the ETag of the game).
rest.problem.VERSION_MISMATCH.title=Outdated version
rest.problem.VERSION_MISMATCH.detail=The game {0} has changed since you loaded it. Reload it and try again.
rest.problem.BOT_UNAVAILABLE.title=Bot unavailable
rest.problem.BOT_UNAVAILABLE.detail=The bot {0} cannot play right now. The game has not changed.

rest.bot.PAWN.description=Plays like a child who has just learnt the moves: loves captures and checks, hangs pieces.
rest.bot.KNIGHT.description=Looks a couple of moves ahead with a short search of its own.
rest.bot.BISHOP.description=Stockfish, heavily limited.
rest.bot.ROOK.description=Stockfish, moderately limited.
rest.bot.QUEEN.description=Stockfish at full strength within its time budget.
