spring:
  application:
    name: kopi-chess
  # The datasource comes from SPRING_DATASOURCE_* environment variables
  # (see compose.yaml) or from Testcontainers in tests and in TestKopiApplication.
  flyway:
    locations: classpath:db/migration
  web:
    resources:
      # Static files get their content's hash in the URL (kopi-<hash>.css), and
      # Thymeleaf's @{...} links follow: a new version is never hidden behind
      # the browser's cache of the old one.
      chain:
        strategy:
          content:
            enabled: true
            paths: /**
  messages:
    # One bundle per adapter that shows text to people; keys never clash (web: plain, REST: rest.*).
    basename: i18n/web/messages, i18n/rest/messages
    # Unknown language -> messages.properties (English), never the server's OS language.
    fallback-to-system-locale: false

# The Stockfish bots (design §7). Values live here, not in code, and are
# tuned by the calibration of plan §7.3.
kopi:
  stockfish:
    # The engine binary: KOPI_STOCKFISH, or "stockfish" on the PATH (as in the Docker image).
    path: ${KOPI_STOCKFISH:stockfish}
    pool-size: 1
    # All three on the same scale (UCI_Elo), well apart. Calibration round 1 mixed
    # Skill Level 3 (BISHOP) with Elo 1600 (ROOK): ROOK scored only 47% (docs/notas/calibracion.md).
    profiles:
      BISHOP:
        limit-strength: true
        elo: 1320       # Stockfish's minimum
        movetime: 100ms
      ROOK:
        limit-strength: true
        elo: 2000
        movetime: 300ms
      QUEEN:
        movetime: 1s    # no handicap
  # Post-game analysis (design §8, ADR-007). A fixed number of nodes per position, not a
  # depth: nodes bound the time, depth 18 once took 93 s on one position
  # (docs/notas/presupuesto-analisis.md). About 1 s per position, 1.5 min for 40 moves
  # (3 min on half a core).
  analysis:
    nodes: 1000000
    multi-pv: 2
    missed-mate-limit: 5
    max-attempts: 3
    workers: 1
  # Requests are answered only for these host names, and changes only from their pages
  # (ADR-016: DNS rebinding, cross-site forms). Reached by another name (a LAN address, a
  # reverse proxy)? Add it to KOPI_ALLOWED_HOSTS, comma-separated.
  local-access:
    allowed-hosts: "${KOPI_ALLOWED_HOSTS:localhost,127.0.0.1,[::1]}"

# Every line about a game carries its id (design §14): "[game <uuid>]" in plain text, a "gameId"
# field in JSON. The Docker image logs JSON (LOGGING_STRUCTURED_FORMAT_CONSOLE in the Dockerfile).
# The whole UCI conversation with Stockfish: LOGGING_LEVEL_KOPI_UCI=DEBUG (KOPI_UCI_LOG with Compose).
logging:
  pattern:
    # A block scalar, so YAML leaves the regex's backslashes alone; no game, no brackets.
    correlation: >-
      %replace([game %X{gameId}] ){'\[game \] ', ''}

server:
  port: 8080
  # Only this machine by default (design §15): run from the jar or the IDE, Kopi Chess is not
  # reachable from the network. The Docker image listens on every interface of its container
  # (KOPI_ADDRESS=0.0.0.0 in the Dockerfile); Compose publishes it on 127.0.0.1 only.
  address: ${KOPI_ADDRESS:127.0.0.1}
  servlet:
    session:
      # The session (only for the one-off messages after a redirect, such as "game deleted")
      # goes in a cookie, never in the URL: Tomcat would otherwise add ";jsessionid=…" to the
      # first redirect, before it knows the browser keeps cookies (found by the E2E test).
      tracking-modes: cookie

management:
  endpoints:
    web:
      exposure:
        # metrics: to browse them by hand; prometheus: what Prometheus scrapes (design §14).
        include: health, info, metrics, prometheus
  endpoint:
    health:
      # Local app: listing which components are up (db, disk…) is useful and harmless.
      show-components: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
  info:
    java:
      enabled: true
