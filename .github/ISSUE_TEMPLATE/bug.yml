name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: For chess bugs, include the FEN or PGN.
      placeholder: |
        1. Start a game against ...
        2. FEN: ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
