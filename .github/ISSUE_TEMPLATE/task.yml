name: Task
description: A unit of planned work (usually a checkbox from the development plan)
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should exist or work when this is done?
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Steps, design notes, links to the design document or ADRs.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
    validations:
      required: true
