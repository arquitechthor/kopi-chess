name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/**/pom.xml

      # Official release, pinned and checksum-verified (digest from the GitHub release).
      # The "universal" build runs on any x86-64 CPU.
      - name: Install Stockfish (reference for the differential test)
        env:
          STOCKFISH_URL: https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz
          STOCKFISH_SHA256: 9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 --max-time 120 -o stockfish.tar.gz "$STOCKFISH_URL"
          echo "$STOCKFISH_SHA256  stockfish.tar.gz" | sha256sum -c -
          mkdir stockfish && tar -xzf stockfish.tar.gz -C stockfish
          binary=$(find "$PWD/stockfish" -type f -name 'stockfish-linux-x86-64*' ! -name '*.*' | head -n 1)
          test -n "$binary" && chmod +x "$binary" && "$binary" quit
          echo "KOPI_STOCKFISH=$binary" >> "$GITHUB_ENV"

      # The end-to-end test (tag "e2e") drives Chromium through Playwright, which
      # downloads the browser on first use: kept between runs. The system libraries
      # it needs come from Playwright's own installer (same version as
      # playwright.version in backend/pom.xml; Node only runs this one command).
      - name: Cache Playwright's browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('backend/pom.xml') }}

      - name: Install the browser's system libraries
        run: npx --yes playwright@1.64.0 install-deps chromium

      - name: Verify (compile, unit + slow + integration + end-to-end tests, architecture rules)
        run: ./mvnw -B -ntp verify -Pslow-tests

      - name: Upload the end-to-end trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: backend/kopi-bootstrap/target/playwright/
          if-no-files-found: ignore

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: backend/**/target/site/jacoco/
          if-no-files-found: ignore

  secrets:
    name: No secrets in the history
    runs-on: ubuntu-latest
    steps:
      # The whole history, not only the last commit: a secret removed in a
      # later commit is still public.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Official release, pinned and checksum-verified (digest from the GitHub
      # release), like Stockfish above: updated by hand, Dependabot does not see it.
      - name: Install gitleaks
        env:
          GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 --max-time 60 -o gitleaks.tar.gz "$GITLEAKS_URL"
          echo "$GITLEAKS_SHA256  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$PWD" >> "$GITHUB_PATH"

      # Fails on any finding. Values are redacted in the log, which is public too.
      - name: Scan every commit
        run: gitleaks git --redact --no-banner --exit-code 1 .

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Builds the image as `docker compose up --build` does, including the
      # checksum check and the smoke test of the bundled Stockfish.
      - name: Build the image
        run: docker build -t kopi-chess:ci backend

      - name: Stockfish answers inside the image
        run: printf 'uci\nquit\n' | docker run --rm -i --entrypoint /usr/local/bin/stockfish kopi-chess:ci | grep -q uciok

      # The JVM refuses to start (AOTMode=on) if it cannot use the image's AOT
      # cache: a jar changed after the training run, another JVM… Same flags as
      # the training run in the Dockerfile, so no database is needed.
      - name: The AOT cache is used
        run: >-
          docker run --rm --entrypoint java kopi-chess:ci
          -XX:AOTCache=/app/app.aot -XX:AOTMode=on
          -Dspring.context.exit=onRefresh
          -Dspring.datasource.url=jdbc:postgresql://localhost/kopi
          -Dspring.flyway.enabled=false -Dkopi.analysis.enabled=false
          -jar /app/app.jar
