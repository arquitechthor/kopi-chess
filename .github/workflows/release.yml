name: Release image

# Plan §10: on a version tag, the image goes to GitHub Container Registry,
# for amd64 and arm64, so running Kopi Chess locally needs no build:
#   KOPI_IMAGE=ghcr.io/arquitechthor/kopi-chess:1 docker compose up --no-build
# Run by hand (workflow_dispatch), or on a pull request that changes how the
# image is built, it builds everything but pushes nothing.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml', 'backend/Dockerfile']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build and publish the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # v1.2.3 → 1.2.3, 1.2, 1 and latest; a pre-release (v1.0.0-rc.1) gets
      # only its own tag. Before 1.0 there is no major tag: 0 is not a promise.
      # Also the OCI labels for version, revision and creation date.
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,enable=${{ github.event_name != 'push' }}

      # First the platform this runner can run, loaded locally, to try it
      # before anything is published.
      - name: Build for amd64
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64
          load: true
          tags: kopi-chess:release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Stockfish answers inside the image
        run: printf 'uci\nquit\n' | docker run --rm -i --entrypoint /usr/local/bin/stockfish kopi-chess:release | grep -q uciok

      - name: The image runs as a non-root user
        run: test "$(docker image inspect --format '{{.Config.User}}' kopi-chess:release)" = kopi

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both platforms; amd64 comes from the cache of the step above.
      - name: Build for amd64 and arm64, and publish
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
